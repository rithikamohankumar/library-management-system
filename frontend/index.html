<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div>
            <h1>📚 Library Management System</h1>
            <p>Manage your library easily and efficiently</p>
        </div>
    </header>


    <!-- Dashboard -->
    <section class="dashboard">

        <div class="card">
            <div class="card-icon">📚</div>
            <div>
                <h3>Total Books</h3>
                <h2 id="totalBooks">0</h2>
            </div>
        </div>

        <div class="card">
            <div class="card-icon">✅</div>
            <div>
                <h3>Available Books</h3>
                <h2 id="availableBooks">0</h2>
            </div>
        </div>

        <div class="card">
            <div class="card-icon">📕</div>
            <div>
                <h3>Issued Books</h3>
                <h2 id="issuedBooks">0</h2>
            </div>
        </div>

    </section>


    <!-- Add Book -->
    <section class="section">

        <h2>➕ Add New Book</h2>

        <form id="bookForm">

            <input
                type="text"
                id="book_name"
                placeholder="Book Name"
                required
            >

            <input
                type="text"
                id="author"
                placeholder="Author"
                required
            >

            <input
                type="text"
                id="category"
                placeholder="Category"
                required
            >

            <input
                type="number"
                id="price"
                placeholder="Price"
                min="0"
                required
            >

            <label class="available-check">
                <input
                    type="checkbox"
                    id="available"
                    checked
                >
                Available
            </label>

            <button type="submit" class="add-btn">
                Add Book
            </button>

        </form>

    </section>


    <!-- Book List -->
    <section class="section">

        <div class="list-header">

            <h2>📖 Book Collection</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search books..."
            >

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Book Name</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="bookList"></tbody>

            </table>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            Library Management System | CRUD Web Application
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
